version: '3.8'

services:
  # PostgreSQL Database (for Auth, Folder, Contact, etc.)
  postgres:
    image: postgres:15-alpine
    container_name: cms-email-postgres
    environment:
      POSTGRES_DB: cms_email
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cms-email-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database (for Email Service)
  mongodb:
    image: mongo:7
    container_name: cms-email-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: cms_email
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - cms-email-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (for Sessions & Caching)
  redis:
    image: redis:7-alpine
    container_name: cms-email-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cms-email-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin (Optional - for PostgreSQL management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cms-email-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cms-email.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - cms-email-network

  # Mongo Express (Optional - for MongoDB management)
  mongo-express:
    image: mongo-express:latest
    container_name: cms-email-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - cms-email-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  cms-email-network:
    driver: bridge